<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenRGB – 2572028</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <h1>RGB Control Panel</h1>

        <div class="rgb-group">
            <input type="number" id="r" class="rgb-input" placeholder="R" min="0" max="255">
            <input type="number" id="g" class="rgb-input" placeholder="G" min="0" max="255">
            <input type="number" id="b" class="rgb-input" placeholder="B" min="0" max="255">
        </div>

        <div class="btn-container">
            <button class="btn-submit" onclick="change_color()">Terapkan</button>
            <button class="btn-random" onclick="random_color()">Acak Warna</button>
        </div>
        <div class="display-area">
            <div>Skor Saat Ini:</div>
            <div id="counter">0</div>
        </div>
        <div class="btn-container">
            <button class="btn-add" onclick="add_poin()">Tambah (+1)</button>
            <button class="btn-remove" onclick="remove_poin()">Kurang (1)</button>
        </div>
        <div class="btn-container">
            <button class="btn-reset" onclick="reset()">Reset Ke Default</button>
        </div>
        <div class="footer">
            <strong>&copy; 2026 2572028 - Nathanael Wijaya. All rights reserved.</strong>
        </div>
    </div>

    </div>

    <script>
        var score = 0;
        var score_label = document.getElementById("counter");
        var val_r = document.getElementById("r");
        var val_g = document.getElementById("g");
        var val_b = document.getElementById("b");

        function change_color() {
            var rgb = `rgb(${val_r.value},${val_g.value},${val_b.value})`
            document.body.style.backgroundColor = rgb
        }
        function return_value() {
            return (Math.floor(Math.random() * 255) + 1);

        }

        function random_color() {
            val_r.value = return_value();
            val_g.value = return_value();
            val_b.value = return_value();
            var rgb = `rgb(${val_r.value},${val_g.value},${val_b.value})`
            document.body.style.backgroundColor = rgb
        }

        function add_poin() {
            score += 1;
            score_label.innerHTML = score
        }
        function remove_poin() {
            score -= 1
            score_label.innerHTML = score
        }

        function reset() {
            score = 0
            score_label.innerHTML = score
            val_r.value = "";
            val_g.value = "";
            val_b.value = "";
            var rgb = `rgb(255,255,255)`
            document.body.style.backgroundColor = rgb
        }
    </script>
</body>

</html>
